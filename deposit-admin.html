<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deposit Requests | Limitless Expressions</title><style>body{background:#10151d;color:white;font:16px system-ui;padding:25px}main{max-width:620px;margin:auto}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;background:#253040;color:white;border:1px solid #536073}label{display:block;margin:16px 0 5px}button{background:#60d7c0;border:0;padding:13px;border-radius:9px;font-weight:700;cursor:pointer;margin-top:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#253040;padding:15px;border-radius:8px}.muted{color:#bbc4d0}</style></head><body><main><h1>Create a deposit request</h1><p class="muted">Private admin tool. Never share this page or your admin token with customers. Token is not saved by this page.</p><form id="form"><label>Admin token<input id="auth" type="password" required autocomplete="off"></label><label>Customer name<input id="name" required minlength="2"></label><label>Customer email (optional)<input id="email" type="email"></label><label>Order description<textarea id="description" required minlength="3" rows="3"></textarea></label><label>Agreed total ($)<input id="total" type="number" min="1" step=".01" required></label><label>Deposit percentage<select id="percent"><option value="50" selected>50% (default)</option><option value="25">25%</option><option value="75">75%</option><option value="100">100%</option></select></label><p id="summary"></p><button type="submit">Generate customer payment link</button></form><pre id="result" aria-live="polite"></pre><button id="copy" type="button" hidden>Copy link</button></main><script src="/order-config.js"></script><script>
const $=id=>document.getElementById(id),api=window.LIMITLESS_ORDER_CONFIG?.apiBase;let last='';
function cents(v){return Math.round(Number(v)*100)}
function refresh(){const total=cents($('total').value),dep=Math.round(total*Number($('percent').value)/100);$('summary').textContent=Number.isFinite(total)&&total>0?'Deposit: $'+(dep/100).toFixed(2)+' • Due at pickup: $'+((total-dep)/100).toFixed(2):''}
$('total').addEventListener('input',refresh);$('percent').addEventListener('change',refresh);
$('form').addEventListener('submit',async e=>{e.preventDefault();const total=cents($('total').value),dep=Math.round(total*Number($('percent').value)/100),button=$('form').querySelector('button');button.disabled=true;$('result').textContent='Creating request…';try{if(!api)throw Error('API is not configured');const r=await fetch(api+'/api/admin/deposits',{method:'POST',headers:{Authorization:'Bearer '+$('auth').value,'Content-Type':'application/json'},body:JSON.stringify({customerName:$('name').value,customerEmail:$('email').value,description:$('description').value,totalCents:total,depositCents:dep})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');last=d.url;$('result').textContent='Customer link: '+last+'\nDeposit: $'+(d.depositCents/100).toFixed(2);$('copy').hidden=false;}catch(err){$('result').textContent=err.message}finally{button.disabled=false}});
$('copy').addEventListener('click',()=>navigator.clipboard.writeText(last));
</script></body></html>
