<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom Order Deposit | Limitless Expressions 3D</title><style>body{font:16px system-ui;background:#10151d;color:#f4f6fa;margin:0;padding:32px 16px}main{max-width:550px;margin:auto;background:#1c2430;padding:28px;border-radius:18px}h1{font-size:26px}p{line-height:1.55}button{background:#60d7c0;border:0;border-radius:9px;padding:14px 20px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}dl{display:grid;grid-template-columns:1fr auto;gap:12px}dd{margin:0;font-weight:700}.muted{color:#bbc4d0}a{color:#60d7c0}</style></head><body><main><p class="muted">LIMITLESS EXPRESSIONS 3D</p><h1>Custom Order Deposit</h1><div id="content">Loading your order…</div><p class="muted">Local pickup is arranged privately after your order is ready. Your deposit is applied toward the total. Do not send payment until you have agreed on the order details with us.</p><p><a href="/">Back to website</a></p></main><script>
const API='https://limitless-orders-staging.workers.dev'; // Replace with the production PUBLIC_API_ORIGIN before deployment.
const q=new URLSearchParams(location.search),id=q.get('id'),token=q.get('token'),content=document.getElementById('content');
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n/100);
async function start(){const btn=document.querySelector('button');btn.disabled=true;try{const r=await fetch(API+'/api/deposits/'+encodeURIComponent(id)+'/checkout?token='+encodeURIComponent(token),{method:'POST'}),d=await r.json();if(!r.ok)throw Error(d.error||'Checkout unavailable');location.assign(d.url)}catch(e){btn.disabled=false;alert(e.message)}}
(async()=>{try{if(!/^[a-f0-9-]{36}$/.test(id||'')||!/^[a-f0-9]{64}$/.test(token||''))throw Error('Invalid deposit link');const r=await fetch(API+'/api/deposits/'+encodeURIComponent(id)+'?token='+encodeURIComponent(token)),d=await r.json();if(!r.ok)throw Error(d.error||'Order unavailable');content.replaceChildren();const title=document.createElement('h2');title.textContent=d.description;content.append(title);const p=document.createElement('p');p.textContent='Prepared for '+d.customerName;content.append(p);const dl=document.createElement('dl');for(const [k,v] of [['Order total',d.totalCents],['Deposit due now',d.depositCents],['Remaining at pickup',d.totalCents-d.depositCents]]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=money(v);dl.append(dt,dd)}content.append(dl);const state=document.createElement('p');state.textContent=d.status==='paid'?'Deposit received. Thank you!':d.expired?'This deposit request has expired.':d.status==='review_required'?'Payment is under review. Please contact us.': 'Payment is required before production begins.';content.append(state);if(['open','checkout_pending'].includes(d.status)&&!d.expired){const b=document.createElement('button');b.textContent='Pay deposit securely';b.addEventListener('click',start);content.append(b)}}catch(e){content.textContent=e.message}})();
</script></body></html>
