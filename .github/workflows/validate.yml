name: Validate website and backend

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run project tests
        run: npm test
      - name: Check backend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find backend/src -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
