name: Deploy Cloudflare staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging only
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run automated tests
        run: npm test
      - name: Validate staging prerequisites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing staging CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing staging CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -f backend/wrangler.giveaway-staging.jsonc || { echo "::error::Staging Wrangler config not committed. Deployment blocked."; exit 1; }
      - name: Protect existing staging bindings before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/limitless-expressions-api-staging/settings" \
            > /tmp/staging-settings.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const remote = JSON.parse(fs.readFileSync('/tmp/staging-settings.json','utf8'));
          const local = JSON.parse(fs.readFileSync('backend/wrangler.giveaway-staging.jsonc','utf8'));
          if (!remote.success || !Array.isArray(remote.result?.bindings)) {
            console.error('::error::Unable to verify existing staging bindings; deployment blocked.');
            process.exit(1);
          }
          const bindings = remote.result.bindings;
          const expected = new Map([
            ...local.d1_databases.map(x=>[x.binding,'d1']),
            ...local.r2_buckets.map(x=>[x.binding,'r2_bucket'])
          ]);
          const unexpected = bindings.filter(x=>!expected.has(x.name) && !['secret_text','plain_text'].includes(x.type));
          const wrong = bindings.filter(x=>expected.has(x.name) && x.type !== expected.get(x.name));
          const missing = [...expected.keys()].filter(name=>!bindings.some(x=>x.name===name));
          if (unexpected.length || wrong.length || missing.length) {
            console.error('::error::Existing staging bindings differ from the checked-in config. Deployment blocked.');
            console.error('Additional binding names:', unexpected.map(x=>x.name).join(', ') || 'none');
            console.error('Type mismatches:', wrong.map(x=>x.name).join(', ') || 'none');
            console.error('Missing expected bindings:', missing.join(', ') || 'none');
            process.exit(1);
          }
          console.log('Staging binding names/types verified. Secret values were not printed.');
          NODE
      - name: Verify existing staging resource identities and cron schedule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/limitless-expressions-api-staging"
          curl --fail-with-body -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/schedules" > /tmp/staging-crons.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cfg=JSON.parse(fs.readFileSync('backend/wrangler.giveaway-staging.jsonc','utf8'));
          const remote=JSON.parse(fs.readFileSync('/tmp/staging-settings.json','utf8'));
          const crons=JSON.parse(fs.readFileSync('/tmp/staging-crons.json','utf8'));
          const fail=(reason)=>{console.error('::error::'+reason+'; deployment blocked');process.exit(1)};
          if(!crons.success || !Array.isArray(crons.result?.schedules)) fail('Cannot verify existing staging schedules');
          const localCrons=(cfg.triggers?.crons||[]).slice().sort();
          const remoteCrons=crons.result.schedules.map(x=>x.cron).sort();
          if(JSON.stringify(localCrons)!==JSON.stringify(remoteCrons)) fail('Existing cron schedules differ from repository configuration');
          for(const d of cfg.d1_databases||[]){
            const b=remote.result.bindings.find(x=>x.name===d.binding);
            if(!b || b.id!==d.database_id) fail('D1 database identity mismatch for '+d.binding);
          }
          for(const bucket of cfg.r2_buckets||[]){
            const b=remote.result.bindings.find(x=>x.name===bucket.binding);
            if(!b || b.bucket_name!==bucket.bucket_name) fail('R2 bucket identity mismatch for '+bucket.binding);
          }
          console.log('Existing staging cron, D1 and R2 identities match repository config.');
          NODE
      - name: Deploy giveaway staging Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --keep-vars --config wrangler.giveaway-staging.jsonc
