name: Apply isolated giveaway test table migration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-live-worker
  cancel-in-progress: false
jobs:
  migrate:
    name: Create isolated test table in LIVE D1
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Identify existing LIVE D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail-with-body -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/limitless-expressions-api/settings" > /tmp/live-settings.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const settings=JSON.parse(fs.readFileSync('/tmp/live-settings.json','utf8'));
          const d1=settings.result?.bindings?.filter(x=>x.type==='d1')||[];
          if(!settings.success||d1.length!==1||d1[0].name!=='DB'||!d1[0].id)throw Error('Unexpected LIVE D1 bindings; aborting');
          fs.writeFileSync('backend/wrangler.giveaway-migration.generated.json',JSON.stringify({
            name:'limitless-expressions-api',
            main:'src/worker.js',
            compatibility_date:'2026-10-01',
            d1_databases:[{binding:'DB',database_name:'live-orders',database_id:d1[0].id,migrations_dir:'migrations'}]
          }));
          console.log('LIVE D1 binding validated.');
          NODE
      - name: Apply only isolated test-entry table SQL
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute DB --remote --config wrangler.giveaway-migration.generated.json --file migrations/0005_giveaway_test_entries.sql
      - name: Verify test table exists
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute DB --remote --config wrangler.giveaway-migration.generated.json --command "SELECT name FROM sqlite_master WHERE type='table' AND name='giveaway_test_entries'"
