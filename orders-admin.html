<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Regular Orders | Limitless Expressions</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#10151d;color:#f4f7fb;font:15px system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:28px 20px 70px}a{color:#60d7c0}header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{font-size:28px;margin:12px 0 5px}.muted{color:#b8c5d3}.panel{background:#1c2634;border:1px solid #384658;border-radius:14px;padding:20px;margin:22px 0}.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}label{display:block;font-size:13px;color:#c5d0db;margin-bottom:6px}input{background:#273448;color:white;border:1px solid #5b6b7e;border-radius:8px;padding:12px;min-width:220px;max-width:100%}button{background:#60d7c0;color:#081c20;border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.tablewrap{overflow:auto;border:1px solid #39485a;border-radius:12px}table{width:100%;min-width:890px;border-collapse:collapse}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #39485a;vertical-align:middle}th{color:#b8c5d3;font-size:12px;white-space:nowrap}td:nth-child(1),td:nth-child(5),td:nth-child(6){white-space:nowrap}td:nth-child(2){min-width:145px}td:nth-child(3){min-width:170px}.status{font-weight:700}.paid{color:#60d7c0}.error{color:#ff9b9b}#detail{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}#files button{margin:6px 8px 0 0}#message{min-height:20px}nav a{margin-right:15px}@media(max-width:600px){main{padding:16px 12px}h1{font-size:24px}.controls>*{width:100%}input{width:100%}}
</style></head><body><main>
<header><div><div class="muted">LIMITLESS EXPRESSIONS 3D</div><h1>Regular Orders</h1><div class="muted">Customer website orders · latest 100</div></div><nav><a href="/deposit-admin.html">Deposit dashboard</a><a href="/">Website</a></nav></header>
<section class="panel"><div class="controls"><div><label for="token">Admin token</label><input id="token" type="password" autocomplete="off" placeholder="Your existing orders admin token"></div><button id="load" type="button">Refresh orders</button><div><label for="search">Filter loaded orders</label><input id="search" type="search" placeholder="Customer, product, order ID"></div></div><p id="message" class="muted" role="status">Enter your admin token to load orders. This page does not save it.</p></section>
<div class="tablewrap"><table><thead><tr><th>Created</th><th>Customer</th><th>Product</th><th>Qty</th><th>Status</th><th>Amount paid</th><th>Order ID</th><th>Manage</th></tr></thead><tbody id="rows"></tbody></table></div>
<section id="detail-panel" class="panel" hidden><h2>Order details</h2><div id="detail"></div><div id="files"></div></section>
</main><script src="/order-config.js"></script><script>
(()=>{
const $=id=>document.getElementById(id);
const api=window.LIMITLESS_ORDER_CONFIG?.apiBase;
let orders=[];
const money=(c,cur='USD')=>c==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:cur||'USD'}).format(c/100);
const message=(txt,error=false)=>{$('message').textContent=txt;$('message').className=error?'error':'muted'};
const headers=()=>({Authorization:'Bearer '+$('token').value.trim()});
async function request(path){const res=await fetch(api+path,{headers:headers(),cache:'no-store'});const data=await res.json();if(!res.ok)throw Error(data.error||'Request failed ('+res.status+')');return data}
function render(){const query=$('search').value.trim().toLowerCase();const body=$('rows');body.replaceChildren();const visible=orders.filter(o=>[o.id,o.customer_name,o.customer_email,o.product,o.status].some(v=>String(v||'').toLowerCase().includes(query)));for(const o of visible){const tr=document.createElement('tr');function cell(t){const td=document.createElement('td');td.textContent=t;tr.append(td);return td}cell(new Date(o.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}));cell(o.customer_name);cell(o.product);cell(String(o.quantity));const status=cell(o.status.replaceAll('_',' '));status.className='status'+(o.status==='paid'?' paid':'');cell(o.status==='paid'?money(o.amount_total,o.currency?.toUpperCase()):'—');cell(o.id);const action=document.createElement('td');const btn=document.createElement('button');btn.type='button';btn.textContent='Details / artwork';btn.onclick=()=>showDetails(o.id);action.append(btn);tr.append(action);body.append(tr)}if(!visible.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=8;td.textContent='No matching orders';tr.append(td);body.append(tr)}}
async function showDetails(id){$('detail-panel').hidden=false;$('detail').textContent='Loading order…';$('files').replaceChildren();$('detail-panel').scrollIntoView({behavior:'smooth',block:'start'});try{const {order,artwork}=await request('/api/admin/orders/'+encodeURIComponent(id));const details=['Order ID: '+order.id,'Customer: '+order.customer_name,'Email: '+order.customer_email,'Product: '+order.product,'Quantity: '+order.quantity,'Status: '+order.status,'Created: '+new Date(order.created_at).toLocaleString(),'Amount paid: '+(order.status==='paid'?money(order.amount_total,order.currency?.toUpperCase()):'Not paid'),'Customizations: '+JSON.stringify(JSON.parse(order.customization||'{}'),null,2),'Pricing snapshot: '+(order.pricing_snapshot||'—')];$('detail').textContent=details.join('\n');if(artwork.length){const heading=document.createElement('h3');heading.textContent='Uploaded artwork';$('files').append(heading)}for(const a of artwork){const btn=document.createElement('button');btn.type='button';btn.textContent='Download '+a.filename;btn.onclick=async()=>{btn.disabled=true;try{const res=await fetch(api+'/api/admin/artwork/'+encodeURIComponent(a.id),{headers:headers()});if(!res.ok)throw Error('Artwork download failed');const blob=await res.blob();const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=a.filename;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}catch(e){alert(e.message)}finally{btn.disabled=false}};$('files').append(btn)}}catch(e){$('detail').textContent=e.message}}
$('load').onclick=async()=>{if(!api){message('Storefront API configuration is missing.',true);return}if(!$('token').value.trim()){message('Enter your admin token.',true);return}const btn=$('load');btn.disabled=true;message('Loading regular orders…');try{const data=await request('/api/admin/orders');orders=data.orders||[];render();message(orders.length+' regular order(s) loaded.')}catch(e){message(e.message,true)}finally{btn.disabled=false}};
$('search').oninput=render;
})();
</script></body></html>
